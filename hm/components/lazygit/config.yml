confirmOnQuit: false
disableStartupPopups: false
git:
  autoFetch: false
  autoRefresh: true
  branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --
  commit:
    signOff: false
    verbose: default
  diffContextSize: 3
  disableForcePushing: false
  log:
    order: topo-order
    showGraph: when-maximised
    showWholeGraph: false
  merging:
    args: ""
    manualCommit: false
  overrideGpg: false
  diffRenderers:
    - colorArg: always
      useConfig: false
      type: rawGit
  parseEmoji: false
  skipHookPrefix: WIP
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium
gui:
  border: single
  commandLogSize: 8
  commitLength:
    show: true
  expandFocusedSidePanel: false
  language: en
  mainPanelSplitMode: flexible
  mouseEvents: true
  scrollHeight: 3
  scrollPastBottom: true
  showBottomLine: false
  showCommandLog: false
  showFileTree: true
  showIcons: true
  showListFooter: true
  showRandomTip: true
  sidePanelWidth: 0.3333
  skipDiscardChangeWarning: false
  skipRewordInEditorWarning: false
  skipStashWarning: false
  splitDiff: auto
  theme:
    activeBorderColor:
      - green
      - bold
    cherryPickedCommitBgColor:
      - cyan
    cherryPickedCommitFgColor:
      - blue
    defaultFgColor:
      - default
    inactiveBorderColor:
      - white
    optionsTextColor:
      - blue
    selectedLineBgColor:
      - blue
    selectedRangeBgColor:
      - blue
    unstagedChangesColor:
      - red
  timeFormat: 02/01/06 15:04 MST
  screenMode: half
keybinding:
  branches:
    checkoutBranchByName: c
    createPullRequest: o
    createTag: T
    fastForward: f
    fetchRemote: f
    forceCheckoutBranch: F
    mergeIntoCurrentBranch: M
    pushTag: P
    rebaseBranch: r
    renameBranch: R
    setUpstream: u
    viewGitFlowOptions: i
    viewPullRequestOptions: O
  commitFiles:
    checkoutCommitFile: c
  commits:
    amendToCommit: A
    checkoutCommit: <space>
    cherryPickCopy: c
    cherryPickCopyRange: C
    copyCommitMessageToClipboard: <ctrl+y>
    createFixupCommit: F
    markCommitAsFixup: f
    moveDownCommit: <ctrl+j>
    moveUpCommit: <ctrl+k>
    openLogMenu: <ctrl+l>
    pasteCommits: v
    pickCommit: p
    renameCommit: r
    renameCommitWithEditor: R
    resetCherryPick: <ctrl+r>
    revertCommit: t
    squashAboveCommits: S
    squashDown: s
    tagCommit: T
    viewBisectOptions: b
    viewResetOptions: g
  files:
    amendLastCommit: A
    commitChanges: c
    commitChangesWithEditor: C
    commitChangesWithoutHook: w
    fetch: f
    ignoreFile: i
    openMergeOptions: M
    openStatusFilter: <ctrl+b>
    refreshFiles: r
    stashAllChanges: s
    toggleStagedAll: a
    toggleTreeView: "`"
    viewResetOptions: D
    viewStashOptions: S
  main:
    pickBothHunks: b
    toggleDragSelect: v
    toggleDragSelect-alt: V
    toggleSelectHunk: a
  stash:
    popStash: g
    renameStash: r
  status:
    checkForUpdate: u
    recentRepos: <enter>
  submodules:
    bulkMenu: b
    init: i
    update: u
  universal:
    appendNewline: <a-enter>
    confirm: <enter>
    confirm-alt1: y
    copyToClipboard: <ctrl+o>
    createPatchOptionsMenu: <ctrl+p>
    createRebaseOptionsMenu: m
    decreaseContextInDiffView: "{"
    diffingMenu: W
    diffingMenu-alt: <ctrl+e>
    edit: e
    executeShellCommand: ":"
    extrasMenu: "@"
    filteringMenu: <ctrl+s>
    goInto: <enter>
    gotoBottom: ">"
    gotoTop: <
    increaseContextInDiffView: "}"
    jumpToBlock:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
    new: n
    nextBlock: <right>
    nextItem: <down>
    nextItem-alt: j
    nextMatch: n
    nextPage: .
    nextScreenMode: +
    nextTab: "]"
    openFile: o
    openRecentRepos: <ctrl+r>
    optionMenu: <disabled>
    optionMenu-alt1: "?"
    prevBlock: <left>
    prevBlock-alt: h
    prevItem: <up>
    prevItem-alt: k
    prevMatch: N
    prevPage: ","
    prevScreenMode: _
    prevTab: "["
    pullFiles: p
    pushFiles: P
    quit: q
    quit-alt1: <ctrl+c>
    quitWithoutChangingDirectory: Q
    redo: <ctrl+z>
    refresh: R
    remove: d
    return: <esc>
    return-alt1: <disabled>
    scrollDownMain: <pgdown>
    scrollDownMain-alt1: J
    scrollDownMain-alt2: <ctrl+d>
    scrollLeft: H
    scrollRight: L
    scrollUpMain: <pgup>
    scrollUpMain-alt1: K
    scrollUpMain-alt2: <ctrl+u>
    select: <space>
    submitEditorText: <enter>
    togglePanel: <tab>
    toggleWhitespaceInDiffView: <ctrl+w>
    undo: z
notARepository: quit
os:
  editCommand: ""
  editCommandTemplate: ""
  openCommand: ""
promptToReturnFromSubprocess: true
quitOnTopLevelReturn: false
refresher:
  fetchInterval: 30
  refreshInterval: 1
update:
  days: 14
  method: prompt
